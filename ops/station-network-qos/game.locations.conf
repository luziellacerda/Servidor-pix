# Added deliberately for direct station-stream.v3 only. No other API path is exposed.
location = /v1/station/online/multiplayer/relay {
    if ($request_method != GET) { return 404; }
    if ($args != "") { return 404; }
    if ($http_upgrade !~* "^websocket$") { return 400; }
    if ($http_sec_websocket_protocol != "station-stream.v3") { return 400; }
    if ($http_authorization !~ "^StationRelay [A-Za-z0-9_-]{43}$") { return 401; }
    # Refused HTTP requests cannot reuse a connection registered as a game for downloads.
    keepalive_timeout 0;
    auth_request /__station_qos_mark;
    auth_request_set $station_qos_applied $upstream_http_x_station_qos_applied;
    add_header X-Station-Qos $station_qos_applied always;
    error_page 500 = @station_game_without_qos;
    include /etc/nginx/snippets/station-direct-game-proxy.conf;
}

location = /__station_qos_mark {
    internal;
    proxy_pass http://unix:/run/station-network-qos/priority.sock:/mark;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Host localhost;
    proxy_set_header Content-Length "";
    proxy_set_header X-Station-Qos-IP $realip_remote_addr;
    proxy_set_header X-Station-Qos-Port $realip_remote_port;
    proxy_connect_timeout 200ms;
    proxy_send_timeout 200ms;
    proxy_read_timeout 500ms;
    access_log off;
}

# QoS is optional; backend authorization is mandatory on both paths.
location @station_game_without_qos {
    keepalive_timeout 0;
    add_header X-Station-Qos "0" always;
    include /etc/nginx/snippets/station-direct-game-proxy.conf;
}
