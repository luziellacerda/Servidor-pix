# Dedicated DNS-only origin. All authorization and consumption remain in the Station API.
server {
    listen 443 ssl;
    server_name downloads-station.lzgames.com.br;
    ssl_certificate /etc/station-direct-download/tls/fullchain.pem;
    ssl_certificate_key /etc/station-direct-download/tls/private-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:StationDirectTLS:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/station-direct-download.error.log warn;
    client_max_body_size 8k;
    client_body_timeout 10s;
    if ($host != downloads-station.lzgames.com.br) { return 404; }

    location ~ "^/v1/station/artifacts/[A-Za-z0-9_-]{43}$" {
        if ($request_method != GET) { return 404; }
        if ($args != "") { return 404; }
        proxy_pass http://127.0.0.1:5192;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Station-Request-Proof $http_x_station_request_proof;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_set_header Cookie "";
        proxy_set_header Proxy "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_intercept_errors off;
    }

    location / { return 404; }
}
