# Incluir dentro dos server blocks já existentes de app.lzgames.com.br, HTTP e HTTPS.
# Não editar location ^~ /v1/suite/ nem qualquer location de suite-content.

location ^~ /v1/station/artifacts/ {
    client_max_body_size 8k;
    client_body_timeout 10s;
    proxy_http_version 1.1;
    proxy_pass http://127.0.0.1:5192;
    proxy_connect_timeout 5s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;
    proxy_buffering off;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-ID $request_id;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie "";
    proxy_set_header Proxy "";
    proxy_intercept_errors off;
    proxy_cache off;
    access_log off;
}

location ^~ /v1/station/ {
    client_max_body_size 8k;
    client_body_timeout 10s;
    proxy_http_version 1.1;
    proxy_pass http://127.0.0.1:5192;
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-ID $request_id;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie "";
    proxy_set_header Proxy "";
    proxy_intercept_errors off;
    proxy_cache off;
    access_log off;
}
