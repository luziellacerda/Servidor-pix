# Candidato: acrescentar dentro dos blocos HTTP/HTTPS existentes de app.lzgames.com.br.
# Duas rotas exatas; esta revisão não instalou este arquivo em produção.
location = /v1/station/online/command {
    limit_except POST { deny all; }
    client_max_body_size 8k;
    client_body_timeout 10s;
    proxy_http_version 1.1;
    proxy_pass http://127.0.0.1:5192;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_buffering off;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-ID $http_x_correlation_id;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie "";
    proxy_set_header Proxy "";
    proxy_intercept_errors off;
    proxy_cache off;
    access_log off;
}

